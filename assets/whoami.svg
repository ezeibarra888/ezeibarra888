<svg xmlns="http://www.w3.org/2000/svg" width="960" height="501" viewBox="0 0 960 501" role="img" aria-labelledby="t d">
<title id="t">whoami de Ezequiel Ibarra</title>
<desc id="d">Terminal oscura que imprime linea por linea el perfil: Ezequiel Ibarra, Fullstack Developer y DevSecOps en Argentina, su mision y sus principios de seguridad.</desc>
<defs>
  <linearGradient id="pan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0b1014"/><stop offset="100%" stop-color="#05070a"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#132029"/><stop offset="100%" stop-color="#0c141a"/>
  </linearGradient>
  <filter id="gl" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="pc"><rect x="1" y="1" width="958" height="499" rx="12"/></clipPath>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#00ff9c" opacity="0.045"/>
  </pattern>
</defs>
<style>
  text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace}
  @keyframes rev{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
  .ln{opacity:0;animation:rev 0.55s ease-out both}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .cur{animation:blink 1.05s step-end infinite}
  @keyframes bp{0%,100%{opacity:.3}50%{opacity:1}}
  .bp{animation:bp 2s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateY(-40px)}100%{transform:translateY(501px)}}
  .sw{animation:sweep 7s linear infinite}
</style>
<g clip-path="url(#pc)">
  <rect x="1" y="1" width="958" height="499" rx="12" fill="url(#pan)"/>
  <rect x="1" y="1" width="958" height="499" fill="url(#scan)"/>
  <rect class="sw" x="1" y="0" width="958" height="40" fill="#00ff9c" opacity="0.05"/>
  <rect x="1" y="1" width="958" height="42" fill="url(#bar)"/>
  <circle cx="26" cy="22" r="5.5" fill="#ff5f57" opacity="0.85"/>
  <circle cx="46" cy="22" r="5.5" fill="#febc2e" opacity="0.85"/>
  <circle cx="66" cy="22" r="5.5" fill="#28c840" opacity="0.85"/>
  <text x="92" y="27" font-size="12.5" fill="#7f9aa8">ezeibarra888@secnode &#8212; /usr/bin/whoami</text>
  <g text-anchor="end">
    <text x="916" y="27" font-size="11.5" fill="#4b6b7a">tls 1.3 &#183; canal cifrado</text>
    <circle class="bp" cx="934" cy="22" r="4" fill="#00ff9c" filter="url(#gl)"/>
  </g>
  <path d="M1 43 H 959" stroke="#1b3a30" stroke-width="1"/>
  <g class="ln" style="animation-delay:0.0s"><text x="26" y="86.0" fill="#1d4034" font-size="11">01</text><text x="56" y="86.0" font-size="13.5"><tspan fill="#00ff9c" xml:space="preserve">root@secnode</tspan><tspan fill="#c9d1d9" xml:space="preserve">:~# </tspan><tspan fill="#9affd8" xml:space="preserve">whoami --verbose</tspan></text></g>
  <g class="ln" style="animation-delay:0.22s"><text x="26" y="106.5" fill="#1d4034" font-size="11">02</text></g>
  <g class="ln" style="animation-delay:0.44s"><text x="26" y="127.0" fill="#1d4034" font-size="11">03</text><text x="56" y="127.0" font-size="13.5"><tspan fill="#6ee7b7" xml:space="preserve">operador        </tspan><tspan fill="#c9d1d9" xml:space="preserve">: Ezequiel Ibarra </tspan><tspan fill="#4b6b7a" xml:space="preserve">&lt;ezedev&gt;</tspan></text></g>
  <g class="ln" style="animation-delay:0.66s"><text x="26" y="147.5" fill="#1d4034" font-size="11">04</text><text x="56" y="147.5" font-size="13.5"><tspan fill="#6ee7b7" xml:space="preserve">rol             </tspan><tspan fill="#c9d1d9" xml:space="preserve">: Fullstack Developer / DevSecOps</tspan></text></g>
  <g class="ln" style="animation-delay:0.88s"><text x="26" y="168.0" fill="#1d4034" font-size="11">05</text><text x="56" y="168.0" font-size="13.5"><tspan fill="#6ee7b7" xml:space="preserve">base            </tspan><tspan fill="#c9d1d9" xml:space="preserve">: Argentina </tspan><tspan fill="#0f8f63" xml:space="preserve">·</tspan><tspan fill="#c9d1d9" xml:space="preserve"> UTC-3</tspan></text></g>
  <g class="ln" style="animation-delay:1.1s"><text x="26" y="188.5" fill="#1d4034" font-size="11">06</text><text x="56" y="188.5" font-size="13.5"><tspan fill="#6ee7b7" xml:space="preserve">uptime          </tspan><tspan fill="#c9d1d9" xml:space="preserve">: sistemas en produccion que no se pueden caer</tspan></text></g>
  <g class="ln" style="animation-delay:1.32s"><text x="26" y="209.0" fill="#1d4034" font-size="11">07</text></g>
  <g class="ln" style="animation-delay:1.54s"><text x="26" y="229.5" fill="#1d4034" font-size="11">08</text><text x="56" y="229.5" font-size="13.5"><tspan fill="#4b6b7a" xml:space="preserve"># mision</tspan></text></g>
  <g class="ln" style="animation-delay:1.76s"><text x="26" y="250.0" fill="#1d4034" font-size="11">09</text><text x="56" y="250.0" font-size="13.5"><tspan fill="#0f8f63" xml:space="preserve">  - </tspan><tspan fill="#c9d1d9" xml:space="preserve">software de gestion que corre en produccion, no en slides</tspan></text></g>
  <g class="ln" style="animation-delay:1.98s"><text x="26" y="270.5" fill="#1d4034" font-size="11">10</text><text x="56" y="270.5" font-size="13.5"><tspan fill="#0f8f63" xml:space="preserve">  - </tspan><tspan fill="#c9d1d9" xml:space="preserve">automatizar el deploy hasta que apretar el boton sea aburrido</tspan></text></g>
  <g class="ln" style="animation-delay:2.2s"><text x="26" y="291.0" fill="#1d4034" font-size="11">11</text><text x="56" y="291.0" font-size="13.5"><tspan fill="#0f8f63" xml:space="preserve">  - </tspan><tspan fill="#c9d1d9" xml:space="preserve">tratar la seguridad como requisito, no como parche final</tspan></text></g>
  <g class="ln" style="animation-delay:2.42s"><text x="26" y="311.5" fill="#1d4034" font-size="11">12</text></g>
  <g class="ln" style="animation-delay:2.64s"><text x="26" y="332.0" fill="#1d4034" font-size="11">13</text><text x="56" y="332.0" font-size="13.5"><tspan fill="#4b6b7a" xml:space="preserve"># principios</tspan></text></g>
  <g class="ln" style="animation-delay:2.86s"><text x="26" y="352.5" fill="#1d4034" font-size="11">14</text><text x="56" y="352.5" font-size="13.5"><tspan fill="#6ee7b7" xml:space="preserve">  shift_left      </tspan><tspan fill="#c9d1d9" xml:space="preserve">: </tspan><tspan fill="#9affd8" xml:space="preserve">"la vuln mas barata es la que nunca se mergeo"</tspan></text></g>
  <g class="ln" style="animation-delay:3.08s"><text x="26" y="373.0" fill="#1d4034" font-size="11">15</text><text x="56" y="373.0" font-size="13.5"><tspan fill="#6ee7b7" xml:space="preserve">  least_privilege </tspan><tspan fill="#c9d1d9" xml:space="preserve">: </tspan><tspan fill="#00ff9c" xml:space="preserve">enforced</tspan></text></g>
  <g class="ln" style="animation-delay:3.3s"><text x="26" y="393.5" fill="#1d4034" font-size="11">16</text><text x="56" y="393.5" font-size="13.5"><tspan fill="#6ee7b7" xml:space="preserve">  observabilidad  </tspan><tspan fill="#c9d1d9" xml:space="preserve">: </tspan><tspan fill="#9affd8" xml:space="preserve">"si no se observa, no existe"</tspan></text></g>
  <g class="ln" style="animation-delay:3.52s"><text x="26" y="414.0" fill="#1d4034" font-size="11">17</text><text x="56" y="414.0" font-size="13.5"><tspan fill="#6ee7b7" xml:space="preserve">  secrets_en_repo </tspan><tspan fill="#c9d1d9" xml:space="preserve">: </tspan><tspan fill="#ff3b5c" xml:space="preserve">never</tspan></text></g>
  <g class="ln" style="animation-delay:3.74s"><text x="26" y="434.5" fill="#1d4034" font-size="11">18</text></g>
  <g class="ln" style="animation-delay:3.96s"><text x="26" y="455.0" fill="#1d4034" font-size="11">19</text><text x="56" y="455.0" font-size="13.5"><tspan fill="#00ff9c" xml:space="preserve">root@secnode</tspan><tspan fill="#c9d1d9" xml:space="preserve">:~# </tspan><tspan class="cur" fill="#00ff9c">█</tspan></text></g>
</g>
<rect x="0.5" y="0.5" width="959" height="500" rx="12" fill="none" stroke="#174a3a"/>
</svg>
