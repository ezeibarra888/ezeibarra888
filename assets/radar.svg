<svg xmlns="http://www.w3.org/2000/svg" width="470" height="442" viewBox="0 0 470 442" role="img" aria-labelledby="t d">
<title id="t">Radar de habilidades</title>
<desc id="d">Radar hexagonal con barrido rotatorio. Niveles aproximados: .NET y C# 95 por ciento, React y TypeScript 86, SQL y datos 90, observabilidad 78, seguridad 76, CI CD y Docker 84.</desc>
<defs>
  <linearGradient id="pan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0b1014"/><stop offset="100%" stop-color="#05070a"/>
  </linearGradient>
  <radialGradient id="fill" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00ff9c" stop-opacity="0.42"/>
    <stop offset="100%" stop-color="#00ff9c" stop-opacity="0.1"/>
  </radialGradient>
  <linearGradient id="wedge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00ff9c" stop-opacity="0.34"/>
    <stop offset="100%" stop-color="#00ff9c" stop-opacity="0"/>
  </linearGradient>
  <filter id="gl" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="pc"><rect x="1" y="1" width="468" height="440" rx="12"/></clipPath>
</defs>
<style>
  text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sweep{transform-origin:235px 212px;animation:spin 4.6s linear infinite}
  @keyframes grow{from{transform:scale(.05);opacity:0}to{transform:scale(1);opacity:1}}
  .shape{transform-origin:235px 212px;animation:grow 1.5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes pop{from{opacity:0}to{opacity:1}}
  .dot{opacity:0;animation:pop .5s ease-out both}
  @keyframes bp{0%,100%{opacity:.25}50%{opacity:1}}
  .bp{animation:bp 2.2s ease-in-out infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .cur{animation:blink 1.05s step-end infinite}
</style>
<g clip-path="url(#pc)">
  <rect x="1" y="1" width="468" height="440" rx="12" fill="url(#pan)"/>
  <text x="22" y="30" font-size="12" fill="#7f9aa8">
    <tspan fill="#00ff9c">scan</tspan><tspan>@stack:~$ </tspan><tspan fill="#9affd8">radar</tspan><tspan class="cur" fill="#00ff9c">&#9608;</tspan>
  </text>
  <g text-anchor="end">
    <text x="432" y="30" font-size="11" fill="#4b6b7a">6 vectores</text>
    <circle class="bp" cx="448" cy="25" r="3.6" fill="#00ff9c" filter="url(#gl)"/>
  </g>
  <g class="sweep">
    <path d="M235 212 L235 80 A 132 132 0 0 1 349.3 146.0 Z" fill="url(#wedge)"/>
  </g>
  <polygon points="235.0,179.0 263.6,195.5 263.6,228.5 235.0,245.0 206.4,228.5 206.4,195.5" fill="none" stroke="#12382c" stroke-width="1" opacity="0.6"/>
  <polygon points="235.0,146.0 292.2,179.0 292.2,245.0 235.0,278.0 177.8,245.0 177.8,179.0" fill="none" stroke="#12382c" stroke-width="1" opacity="0.6"/>
  <polygon points="235.0,113.0 320.7,162.5 320.7,261.5 235.0,311.0 149.3,261.5 149.3,162.5" fill="none" stroke="#12382c" stroke-width="1" opacity="0.6"/>
  <polygon points="235.0,80.0 349.3,146.0 349.3,278.0 235.0,344.0 120.7,278.0 120.7,146.0" fill="none" stroke="#12382c" stroke-width="1" opacity="0.95"/>
  <path d="M235 212 L235.0 80.0" stroke="#12382c" stroke-width="1" opacity="0.7"/>
  <path d="M235 212 L349.3 146.0" stroke="#12382c" stroke-width="1" opacity="0.7"/>
  <path d="M235 212 L349.3 278.0" stroke="#12382c" stroke-width="1" opacity="0.7"/>
  <path d="M235 212 L235.0 344.0" stroke="#12382c" stroke-width="1" opacity="0.7"/>
  <path d="M235 212 L120.7 278.0" stroke="#12382c" stroke-width="1" opacity="0.7"/>
  <path d="M235 212 L120.7 146.0" stroke="#12382c" stroke-width="1" opacity="0.7"/>
  <g class="shape">
    <polygon points="235.0,86.6 333.3,155.2 337.9,271.4 235.0,315.0 148.1,262.2 139.0,156.6" fill="url(#fill)" stroke="#00ff9c" stroke-width="2.2" filter="url(#gl)"/>
  </g>
  <circle class="dot" style="animation-delay:0.9s" cx="235.0" cy="86.6" r="3.4" fill="#00ff9c"/>
  <circle class="dot" style="animation-delay:1.02s" cx="333.3" cy="155.2" r="3.4" fill="#00ff9c"/>
  <circle class="dot" style="animation-delay:1.14s" cx="337.9" cy="271.4" r="3.4" fill="#00ff9c"/>
  <circle class="dot" style="animation-delay:1.26s" cx="235.0" cy="315.0" r="3.4" fill="#00ff9c"/>
  <circle class="dot" style="animation-delay:1.38s" cx="148.1" cy="262.2" r="3.4" fill="#00ff9c"/>
  <circle class="dot" style="animation-delay:1.5s" cx="139.0" cy="156.6" r="3.4" fill="#00ff9c"/>
  <circle cx="235" cy="212" r="2.6" fill="#9affd8"/>
  <text x="235.0" y="49.7" text-anchor="middle" font-size="11.5" fill="#8fb3a6">.NET / C#</text>
  <text x="235.0" y="62.7" text-anchor="middle" font-size="10" fill="#2f6b55">95%</text>
  <text x="379.0" y="132.8" text-anchor="start" font-size="11.5" fill="#8fb3a6">React / TS</text>
  <text x="379.0" y="145.8" text-anchor="start" font-size="10" fill="#2f6b55">86%</text>
  <text x="379.0" y="299.2" text-anchor="start" font-size="11.5" fill="#8fb3a6">SQL / datos</text>
  <text x="379.0" y="312.2" text-anchor="start" font-size="10" fill="#2f6b55">90%</text>
  <text x="235.0" y="382.3" text-anchor="middle" font-size="11.5" fill="#8fb3a6">observabilidad</text>
  <text x="235.0" y="395.3" text-anchor="middle" font-size="10" fill="#2f6b55">78%</text>
  <text x="91.0" y="299.2" text-anchor="end" font-size="11.5" fill="#8fb3a6">seguridad</text>
  <text x="91.0" y="312.2" text-anchor="end" font-size="10" fill="#2f6b55">76%</text>
  <text x="91.0" y="132.8" text-anchor="end" font-size="11.5" fill="#8fb3a6">CI/CD / Docker</text>
  <text x="91.0" y="145.8" text-anchor="end" font-size="10" fill="#2f6b55">84%</text>
  <text x="235" y="426" text-anchor="middle" font-size="10.5" fill="#2f6b55">valores autoevaluados &#183; se ajustan</text>
</g>
<rect x="0.5" y="0.5" width="469" height="441" rx="12" fill="none" stroke="#174a3a"/>
</svg>
